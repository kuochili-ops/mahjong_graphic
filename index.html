<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White 6 台灣麻將</title>
    <style>
        :root {
            --bg-table: #2e7d32; /* 深綠色桌布 */
            --tile-w: 42px;
        }

        body {
            background-color: var(--bg-table);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            color: white;
            overflow: hidden;
        }

        .status-bar {
            margin-top: 30px;
            background: rgba(0,0,0,0.4);
            padding: 10px 40px;
            border-radius: 30px;
            font-size: 1.2rem;
        }

        .mahjong-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            padding: 40px 10px;
            box-sizing: border-box;
        }

        .hand {
            display: flex;
            justify-content: center;
            gap: 1px;
            min-height: 60px;
        }

        /* 移除底座設定，僅保留縮放與互動動畫 */
        .tile {
            width: var(--tile-w);
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: flex-end;
        }

        .tile img {
            width: 100%;
            height: auto;
            display: block;
        }

        .tile:hover {
            transform: translateY(-15px);
        }

        /* 電腦玩家牌背 */
        .cpu-tile {
            width: 32px;
            margin: 0 1px;
        }

        /* 棄牌區容器 (中間透明黑底區) */
        .discard-area {
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
            min-height: 150px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 2px;
            padding: 10px;
        }

        .discard-tile {
            width: 32px;
        }

        .draw-gap {
            margin-left: 10px;
        }

        .btn-reset {
            margin-bottom: 40px;
            padding: 12px 30px;
            font-size: 1rem;
            background: white;
            color: #333;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="status-bar" id="status">輪到你了，請出牌</div>

<div class="mahjong-area">
    <!-- 電腦手牌 -->
    <div class="hand" id="cpuHand"></div>

    <!-- 棄牌區 -->
    <div class="discard-area" id="discardPile"></div>

    <!-- 玩家手牌 -->
    <div class="hand" id="playerHand"></div>
</div>

<button class="btn-reset" onclick="game.init()">重新開局</button>

<script>
const game = (() => {
    const svgBase = "https://raw.githubusercontent.com/kuochili-ops/mahjong_graphic/main/Vectors%20%E7%9F%A2%E9%87%8F%E5%9B%BE/SVG/";
    // 牌背圖片路徑
    const backImg = "https://raw.githubusercontent.com/kuochili-ops/mahjong_graphic/main/Vectors%20%E7%9F%A2%E9%87%8F%E5%9B%BE/SVG/back.svg";
    
    let playerHand = [], discards = [];

    const sort = (h) => h.sort((a,b) => {
        const w = {m:0, p:10, s:20, z:30};
        return (parseInt(a[0]) + w[a[1]]) - (parseInt(b[0]) + w[b[1]]);
    });

    const init = () => {
        // 模擬手牌
        playerHand = sort(['2m','4m','5m','9m','9m','6p','8p','8p','9p','3s','3s','5s','6s','z6','z6','z6']);
        const drawTile = '9p';
        discards = ['z2','z3','z3','4p','3s','8p','z7']; // 模擬截圖中的棄牌
        
        render(playerHand, drawTile);
    };

    const render = (hand, draw) => {
        const pContainer = document.getElementById('playerHand');
        const cContainer = document.getElementById('cpuHand');
        const dContainer = document.getElementById('discardPile');

        // 渲染玩家
        pContainer.innerHTML = '';
        [...hand, draw].forEach((t, i) => {
            const div = document.createElement('div');
            div.className = 'tile' + (i === 16 ? ' draw-gap' : '');
            div.innerHTML = `<img src="${svgBase}${t}.svg">`;
            pContainer.appendChild(div);
        });

        // 渲染電腦牌背
        cContainer.innerHTML = '';
        for(let i=0; i<16; i++) {
            cContainer.innerHTML += `<div class="cpu-tile"><img src="${backImg}"></div>`;
        }

        // 渲染棄牌區
        dContainer.innerHTML = '';
        discards.forEach(t => {
            dContainer.innerHTML += `<div class="discard-tile"><img src="${svgBase}${t}.svg"></div>`;
        });
    };

    return { init };
})();

window.onload = game.init;
</script>

</body>
</html>
