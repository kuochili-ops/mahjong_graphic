<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White 6 台灣麻將 - 比例對齊版</title>
    <style>
        :root {
            --bg-table: #2e7d32;
            /* 調整寬高比，使其與真實麻將牌更接近 */
            --tile-w: 40px;
            --tile-h: 54px; 
            --blue-back: #1565c0;
        }

        body {
            background-color: var(--bg-table);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            color: white;
            overflow: hidden;
        }

        .status-bar {
            margin-top: 30px;
            background: rgba(0,0,0,0.5);
            padding: 10px 40px;
            border-radius: 30px;
            font-size: 1.1rem;
        }

        .mahjong-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            padding: 30px 10px;
            box-sizing: border-box;
        }

        .hand {
            display: flex;
            justify-content: center;
            gap: 2px; /* 增加一點點間隙 */
            min-height: var(--tile-h);
        }

        /* 玩家正面牌型 */
        .tile {
            width: var(--tile-w);
            height: var(--tile-h);
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 確保 SVG 不會變形 */
        }

        .tile:hover {
            transform: translateY(-15px);
        }

        /* 電腦牌背樣式：比例與 .tile 完全一致 */
        .cpu-tile {
            width: var(--tile-w);
            height: var(--tile-h);
            background-color: var(--blue-back);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 4px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.4);
            box-sizing: border-box;
            position: relative;
        }

        /* 牌背裝飾性內框線 */
        .cpu-tile::after {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .discard-area {
            background: rgba(0,0,0,0.15);
            border-radius: 15px;
            min-height: 180px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 4px;
            padding: 15px;
        }

        .discard-tile { width: 30px; height: 40px; }
        .draw-gap { margin-left: 10px; }

        .btn-reset {
            margin-bottom: 40px;
            padding: 12px 35px;
            font-size: 1rem;
            background: white;
            color: #333;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #ccc;
        }
        
        .btn-reset:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #ccc;
        }
    </style>
</head>
<body>

<div class="status-bar" id="status">輪到你了，請出牌</div>

<div class="mahjong-area">
    <!-- 電腦手牌：比例已修正 -->
    <div class="hand" id="cpuHand"></div>
    <div class="discard-area" id="discardPile"></div>
    <!-- 玩家手牌 -->
    <div class="hand" id="playerHand"></div>
</div>

<button class="btn-reset" onclick="game.init()">重新開局</button>

<script>
const game = (() => {
    // 確保路徑編碼正確
    const folder = encodeURIComponent("Vectors 矢量图");
    const svgBase = `https://raw.githubusercontent.com/kuochili-ops/mahjong_graphic/main/${folder}/SVG/`;
    
    let deck = [], playerHand = [];

    const shuffle = (array) => {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    };

    const createDeck = () => {
        let d = [];
        ['m', 'p', 's'].forEach(t => { 
            for(let i=1; i<=9; i++) for(let j=0; j<4; j++) d.push(`${i}${t}`); 
        });
        for(let i=1; i<=7; i++) for(let j=0; j<4; j++) d.push(`${i}z`); 
        return shuffle(d);
    };

    const sort = (h) => h.sort((a,b) => {
        const w = {m:0, p:10, s:20, z:30};
        return (parseInt(a[0]) + w[a[1]]) - (parseInt(b[0]) + w[b[1]]);
    });

    const init = () => {
        deck = createDeck();
        playerHand = sort(deck.splice(0, 16));
        const drawTile = deck.pop();
        render(playerHand, drawTile);
    };

    const render = (hand, draw) => {
        const pContainer = document.getElementById('playerHand');
        const cContainer = document.getElementById('cpuHand');
        
        // 渲染玩家
        pContainer.innerHTML = '';
        [...hand, draw].forEach((t, i) => {
            const div = document.createElement('div');
            div.className = 'tile' + (i === 16 ? ' draw-gap' : '');
            div.innerHTML = `<img src="${svgBase}${t}.svg" onerror="this.parentElement.innerHTML='<small>${t}</small>'">`;
            pContainer.appendChild(div);
        });

        // 渲染電腦牌背
        cContainer.innerHTML = '';
        for(let i=0; i<16; i++) {
            cContainer.innerHTML += `<div class="cpu-tile"></div>`;
        }
    };

    return { init };
})();

window.onload = game.init;
</script>
</body>
</html>
