<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White 6 台灣麻將 (標準版)</title>
    <style>
        :root {
            --bg-table: #235d2a;
            --tile-w: 52px;
            --tile-h: 70px;
        }

        body {
            background-color: var(--bg-table);
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            height: 100vh;
            padding-bottom: 20px;
            font-family: sans-serif;
        }

        .mahjong-hand {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }

        .tile {
            width: var(--tile-w);
            height: var(--tile-h);
            background: white;
            border-radius: 4px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.2s;
            animation: flipIn 0.4s ease-out;
        }

        .tile img { width: 100%; height: 100%; }

        .tile:hover { transform: translateY(-15px); }

        .last-tile { margin-left: 12px; }

        @keyframes flipIn {
            from { transform: rotateX(90deg); opacity: 0; }
            to { transform: rotateX(0deg); opacity: 1; }
        }

        .controls { margin-bottom: 20px; }
        button { padding: 8px 16px; cursor: pointer; border-radius: 4px; border: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="controls">
    <button onclick="game.init()">重新發牌 (16+1)</button>
</div>

<div class="mahjong-hand" id="playerHand"></div>

<script>
const game = (() => {
    const svgBase = "https://raw.githubusercontent.com/kuochili-ops/mahjong_graphic/main/Vectors%20%E7%9F%A2%E9%87%8F%E5%9B%BE/SVG/";
    
    // 定義牌值與排序權重
    const TILE_TYPES = {
        m: 10, p: 20, s: 30, z: 40 // 萬, 筒, 索, 字
    };

    // 建立標準 144 張牌池 (不含花牌先以 136 張示範)
    const createDeck = () => {
        let deck = [];
        ['m', 'p', 's'].forEach(type => {
            for (let i = 1; i <= 9; i++) {
                for (let j = 0; j < 4; j++) deck.push(`${i}${type}`);
            }
        });
        for (let i = 1; i <= 7; i++) { // 1z-7z (東南西北中發白)
            for (let j = 0; j < 4; j++) deck.push(`${i}z`);
        }
        return deck;
    };

    const sortHand = (hand) => {
        return hand.sort((a, b) => {
            const valA = parseInt(a[0]) + TILE_TYPES[a[1]];
            const valB = parseInt(b[0]) + TILE_TYPES[b[1]];
            return valA - valB;
        });
    };

    const init = () => {
        const container = document.getElementById('playerHand');
        container.innerHTML = '';
        
        let deck = createDeck();
        // 洗牌 (Fisher-Yates)
        for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
        }

        // 抽 16 張並理牌
        let hand = sortHand(deck.splice(0, 16));
        // 第 17 張摸牌
        let draw = deck.pop();

        render(container, hand, draw);
    };

    const render = (container, hand, draw) => {
        const fullHand = [...hand, draw];
        fullHand.forEach((tile, index) => {
            const div = document.createElement('div');
            div.className = 'tile';
            if (index === 16) div.classList.add('last-tile');

            const img = document.createElement('img');
            // 轉換為你的 GitHub 檔名格式: 1m.svg, 1z.svg...
            const fileName = (tile[1] === 'z') ? `${tile[0]}z.svg` : `${tile[0]}${tile[1]}.svg`;
            img.src = `${svgBase}${fileName}`;
            
            div.appendChild(img);
            container.appendChild(div);
        });
    };

    return { init };
})();

window.onload = game.init;
</script>

</body>
</html>
