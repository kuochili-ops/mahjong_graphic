<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White 6 台灣麻將 - 修正版</title>
    <style>
        :root {
            --bg-table: #2e7d32;
            --tile-w: 42px;
        }

        body {
            background-color: var(--bg-table);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            color: white;
            overflow: hidden;
        }

        .status-bar {
            margin-top: 30px;
            background: rgba(0,0,0,0.5);
            padding: 10px 40px;
            border-radius: 30px;
            font-size: 1.1rem;
        }

        .mahjong-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            padding: 20px 10px;
            box-sizing: border-box;
        }

        .hand {
            display: flex;
            justify-content: center;
            gap: 1px;
            min-height: 60px;
        }

        /* 移除底座，直接顯示 SVG */
        .tile {
            width: var(--tile-w);
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: flex-end;
        }

        .tile img {
            width: 100%;
            height: auto;
            display: block;
        }

        .tile:hover {
            transform: translateY(-15px);
        }

        .discard-area {
            background: rgba(0,0,0,0.15);
            border-radius: 15px;
            min-height: 180px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 4px;
            padding: 15px;
        }

        .discard-tile { width: 32px; }
        .draw-gap { margin-left: 12px; }

        .cpu-tile { width: 34px; margin: 0 1px; opacity: 0.9; }

        button {
            margin-bottom: 30px;
            padding: 10px 25px;
            font-size: 1rem;
            background: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="status-bar" id="status">輪到你了，請出牌</div>

<div class="mahjong-area">
    <!-- 電腦手牌 (牌背) -->
    <div class="hand" id="cpuHand"></div>

    <!-- 棄牌區 -->
    <div class="discard-area" id="discardPile"></div>

    <!-- 玩家手牌 -->
    <div class="hand" id="playerHand"></div>
</div>

<button onclick="game.init()">重新開局</button>

<script>
const game = (() => {
    // 關鍵修正：對中文目錄進行正確編碼
    const pathPart = encodeURIComponent("Vectors 矢量图");
    const svgBase = `https://raw.githubusercontent.com/kuochili-ops/mahjong_graphic/main/${pathPart}/SVG/`;
    const backImg = `${svgBase}back.svg`;
    
    let deck = [], playerHand = [], cpuHand = [], discards = [];

    // 建立 144 張牌 (含紅中 7z 共 4 張)
    const createDeck = () => {
        let d = [];
        ['m', 'p', 's'].forEach(t => { for(let i=1; i<=9; i++) for(let j=0; j<4; j++) d.push(`${i}${t}`); });
        for(let i=1; i<=7; i++) for(let j=0; j<4; j++) d.push(`${i}z`); 
        return d.sort(() => Math.random() - 0.5);
    };

    const sort = (h) => h.sort((a,b) => {
        const w = {m:0, p:10, s:20, z:30};
        return (parseInt(a[0]) + w[a[1]]) - (parseInt(b[0]) + w[b[1]]);
    });

    const init = () => {
        deck = createDeck();
        playerHand = sort(deck.splice(0, 16));
        cpuHand = deck.splice(0, 16); // 電腦不一定要理牌
        discards = [];
        
        // 摸第一張牌
        const firstDraw = deck.pop();
        render(playerHand, firstDraw);
    };

    const render = (hand, draw) => {
        const pContainer = document.getElementById('playerHand');
        const cContainer = document.getElementById('cpuHand');
        const dContainer = document.getElementById('discardPile');

        // 渲染玩家
        pContainer.innerHTML = '';
        [...hand, draw].forEach((t, i) => {
            const div = document.createElement('div');
            div.className = 'tile' + (i === 16 ? ' draw-gap' : '');
            
            const img = document.createElement('img');
            img.src = `${svgBase}${t}.svg`;
            
            // 偵錯：如果還是破圖，顯示代號
            img.onerror = () => {
                div.style.background = "red";
                div.innerHTML = `<small>${t}</small>`;
            };

            div.appendChild(img);
            pContainer.appendChild(div);
        });

        // 渲染電腦牌背
        cContainer.innerHTML = '';
        for(let i=0; i<16; i++) {
            cContainer.innerHTML += `<div class="cpu-tile"><img src="${backImg}"></div>`;
        }

        // 渲染棄牌區 (範例顯示最後 15 張)
        dContainer.innerHTML = '';
        discards.slice(-15).forEach(t => {
            dContainer.innerHTML += `<div class="discard-tile"><img src="${svgBase}${t}.svg"></div>`;
        });
    };

    return { init };
})();

window.onload = game.init;
</script>

</body>
</html>
