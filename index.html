<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White 6 台灣麻將 (SVG 版)</title>
    <style>
        :root {
            --tile-w: 50px;
            --tile-h: 68px;
            --bg-color: #235d2a;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
            padding-bottom: 30px;
            font-family: sans-serif;
        }

        .hand-area {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            padding: 15px;
            background: rgba(0,0,0,0.15);
            border-radius: 10px;
        }

        .mahjong-svg {
            width: var(--tile-w);
            height: var(--tile-h);
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            /* 讓 SVG 填滿容器 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mahjong-svg img {
            width: 100%;
            height: 100%;
        }

        .mahjong-svg:hover {
            transform: translateY(-15px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        /* 台灣麻將第 17 張牌 (摸牌) 的間距 */
        .draw-tile {
            margin-left: 12px;
        }
    </style>
</head>
<body>

<div class="hand-area" id="playerHand"></div>

<script>
    // 修正後的 SVG 基礎路徑 (百分比編碼處理中文)
    const svgBase = "https://raw.githubusercontent.com/kuochili-ops/mahjong_graphic/main/Vectors%20%E7%9F%A2%E9%87%8F%E5%9B%BE/%E9%9B%80%E9%AD%82%E6%A0%B7%E5%BC%8F%20majsoul%20style/";

    // 模擬一組台灣麻將手牌 (16+1)
    // 檔案命名規則：1m.svg, 2m.svg... z1.svg...
    const currentHand = [
        '1m', '1m', '1m', '2p', '3p', '4p', 
        '5s', '6s', '7s', 'z1', 'z1', 'z2', 
        'z3', 'z4', 'z7', 'z7', 
        'z5' // 摸進來的第 17 張
    ];

    function renderSVGHand() {
        const container = document.getElementById('playerHand');
        container.innerHTML = '';

        currentHand.forEach((tile, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'mahjong-svg';
            if (index === 16) wrapper.classList.add('draw-tile');

            const img = document.createElement('img');
            // 注意：副檔名改為 .svg
            img.src = `${svgBase}${tile}.svg`;
            img.alt = tile;

            // 錯誤處理
            img.onerror = () => {
                wrapper.innerHTML = `<span style="font-size:12px">${tile}</span>`;
                console.error(`無法載入: ${tile}.svg`);
            };

            wrapper.appendChild(img);
            wrapper.onclick = () => console.log(`點擊了: ${tile}`);
            container.appendChild(wrapper);
        });
    }

    window.onload = renderSVGHand;
</script>

</body>
</html>
