<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White 6 台灣麻將 - 最終對齊修正版</title>
    <style>
        :root {
            --bg-table: #2e7d32;
            /* 根據圖片觀察，正面牌實體寬度約為 22px-24px */
            --tile-w: 23px; 
            --tile-h: 33px;
            --blue-back: #1565c0;
            /* 統一間隔 */
            --tile-gap: 2px;
        }

        body {
            background-color: var(--bg-table);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            color: white;
            overflow: hidden;
        }

        .status-bar {
            margin-top: 30px;
            background: rgba(0,0,0,0.5);
            padding: 10px 40px;
            border-radius: 30px;
            font-size: 1.1rem;
        }

        .mahjong-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            padding: 60px 10px;
            box-sizing: border-box;
        }

        .hand {
            display: flex;
            justify-content: center;
            gap: var(--tile-gap);
            min-height: 50px;
            align-items: center;
        }

        /* 玩家正面：調整容器負邊距，抵消 SVG 檔案本身的透明邊框 */
        .tile {
            width: 28px; /* 容器稍大，容納 SVG */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 0 -1px; /* 微調負邊距讓白色牌身更靠攏 */
        }

        .tile img {
            width: 100%;
            height: auto;
            display: block;
        }

        .tile:hover {
            transform: translateY(-10px);
        }

        /* 電腦牌背：嚴格對齊正面白色部分的寬度 */
        .cpu-tile {
            width: var(--tile-w);
            height: var(--tile-h);
            background-color: var(--blue-back);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 2px;
            box-shadow: 0 2px 3px rgba(0,0,0,0.4);
            box-sizing: border-box;
            position: relative;
        }

        .cpu-tile::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 1px;
        }

        .discard-area {
            background: rgba(0,0,0,0.1);
            border-radius: 15px;
            min-height: 180px;
        }

        /* 摸牌間隔 */
        .draw-gap { margin-left: 12px; }

        .btn-reset {
            margin-bottom: 50px;
            padding: 12px 30px;
            background: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="status-bar">輪到你了，請出牌</div>

<div class="mahjong-area">
    <div class="hand" id="cpuHand"></div>
    <div class="discard-area"></div>
    <div class="hand" id="playerHand"></div>
</div>

<button class="btn-reset" onclick="game.init()">重新開局</button>

<script>
const game = (() => {
    const folder = encodeURIComponent("Vectors 矢量图");
    const svgBase = `https://raw.githubusercontent.com/kuochili-ops/mahjong_graphic/main/${folder}/SVG/`;
    
    let deck = [], playerHand = [];

    const shuffle = (array) => {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    };

    const createDeck = () => {
        let d = [];
        ['m', 'p', 's'].forEach(t => { 
            for(let i=1; i<=9; i++) for(let j=0; j<4; j++) d.push(`${i}${t}`); 
        });
        for(let i=1; i<=7; i++) for(let j=0; j<4; j++) d.push(`${i}z`); 
        return shuffle(d);
    };

    const sort = (h) => h.sort((a,b) => {
        const w = {m:0, p:10, s:20, z:30};
        return (parseInt(a[0]) + w[a[1]]) - (parseInt(b[0]) + w[b[1]]);
    });

    const init = () => {
        deck = createDeck();
        playerHand = sort(deck.splice(0, 16));
        render(playerHand, deck.pop());
    };

    const render = (hand, draw) => {
        const pContainer = document.getElementById('playerHand');
        const cContainer = document.getElementById('cpuHand');
        
        pContainer.innerHTML = '';
        [...hand, draw].forEach((t, i) => {
            const div = document.createElement('div');
            div.className = 'tile' + (i === 16 ? ' draw-gap' : '');
            div.innerHTML = `<img src="${svgBase}${t}.svg">`;
            pContainer.appendChild(div);
        });

        cContainer.innerHTML = '';
        for(let i=0; i<16; i++) {
            cContainer.innerHTML += `<div class="cpu-tile"></div>`;
        }
    };

    return { init };
})();

window.onload = game.init;
</script>
</body>
</html>
